name: Clang Windows Host

on:
  workflow_dispatch:
    inputs:
      host:
        description: "Windows host arch to build clang for"
        required: true
        type: choice
        options:
          - x86_64-w64-mingw32
          - aarch64-w64-mingw32
      sources-cache-key:
        description: "Sources cache key (optional)"
        required: false
        type: string
        default: ""
      sources-artifact:
        description: "Sources artifact name (optional)"
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  setup:
    name: Setup
    runs-on: ubuntu-24.04
    outputs:
      host: ${{ inputs.host }}
      win-arch: ${{ steps.cfg.outputs.win-arch }}
      test-runner: ${{ steps.cfg.outputs.test-runner }}
      sources-cache-key: ${{ inputs.sources-cache-key || steps.cache-key.outputs.key }}
    steps:
      - uses: actions/checkout@v4

      - name: Install yq
        if: inputs.sources-cache-key == ''
        run: |
          sudo wget -qO /usr/local/bin/yq "https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64"
          sudo chmod +x /usr/local/bin/yq

      - name: Generate sources cache key
        if: inputs.sources-cache-key == ''
        id: cache-key
        run: |
          KEY=$(./scripts/sources.sh cache-key -T clang)
          echo "key=sources-${KEY}-clang" >>$GITHUB_OUTPUT

      - name: Host config
        id: cfg
        run: |
          case "${{ inputs.host }}" in
            x86_64-w64-mingw32)  echo "win-arch=x86_64";  echo "test-runner=windows-latest" ;;
            aarch64-w64-mingw32) echo "win-arch=arm64";   echo "test-runner=windows-11-arm" ;;
          esac >>"$GITHUB_OUTPUT"

  build:
    name: Build clang (${{ inputs.host }})
    needs: setup
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Restore sources cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: sources
          key: ${{ needs.setup.outputs.sources-cache-key }}

      - name: Download sources (Linux)
        if: steps.cache.outputs.cache-hit != 'true' && inputs.sources-artifact == ''
        run: |
          sudo wget -qO /usr/local/bin/yq "https://github.com/mikefarah/yq/releases/latest/download/yq_linux_$(dpkg --print-architecture | sed 's/amd64/x86_64/')"
          sudo chmod +x /usr/local/bin/yq
          bash ./scripts/sources.sh download -S sources -T clang

      - name: Download sources from artifact
        if: steps.cache.outputs.cache-hit != 'true' && inputs.sources-artifact != ''
        timeout-minutes: 10
        uses: actions/download-artifact@v7
        with:
          name: ${{ inputs.sources-artifact }}
          path: sources

      - name: Save sources cache
        if: steps.cache.outputs.cache-hit != 'true'
        timeout-minutes: 10
        uses: actions/cache/save@v4
        with:
          path: sources
          key: ${{ needs.setup.outputs.sources-cache-key }}

      - name: Build (Alpine Docker)
        run: |
          mkdir -p work orig
          docker run --rm \
            --platform linux/amd64 \
            --cap-add=IPC_LOCK \
            --volume ${PWD}/work:/work \
            --env APK_EXTRA="cmake ninja" \
            --volume "${PWD}:/src:ro" \
            --volume "${PWD}/sources:/sources" \
            --volume "${PWD}/dist:/dist" \
            --volume "${PWD}/orig:/orig" \
            amd64/alpine:latest \
            /bin/sh -c '
              apk add --no-cache \
                coreutils curl bzip2 xz make bison rsync patch perl flex g++ \
                texinfo python3 gawk grep bash tar file zip yq findutils \
                $APK_EXTRA && \
              rsync -a --exclude=sources --exclude=work /src/ /work/ && \
              find /sources -type f -exec touch {} + && \
              cd /work && \
              bash scripts/build.sh \
                -LDPl \
                -a \
                -S /sources \
                -R /orig \
                -o /dist \
                -e clang \
                -H "${{ inputs.host }}" \
                -T clang'

      - name: Upload dist
        timeout-minutes: 10
        uses: actions/upload-artifact@v6
        with:
          name: clang-windows-${{ needs.setup.outputs.win-arch }}
          if-no-files-found: error
          path: dist/clang-win-*.tgz

  test:
    name: Test on Windows (${{ needs.setup.outputs.win-arch }})
    needs: [setup, build]
    runs-on: ${{ needs.setup.outputs.test-runner }}
    steps:
      - name: Download toolchain
        timeout-minutes: 10
        uses: actions/download-artifact@v7
        with:
          name: clang-windows-${{ needs.setup.outputs.win-arch }}

      - name: Extract
        shell: pwsh
        run: |
          $tgz = Get-ChildItem *.tgz | Select-Object -First 1
          tar -xzf $tgz.Name
          Get-ChildItem clang/bin/clang.exe, bin/*-clang.exe | Select-Object -First 5

      - name: clang --version
        shell: pwsh
        run: ./clang/bin/clang.exe --version

      - name: Native PE build and run (host triple)
        shell: pwsh
        run: |
          Set-Content -Path smoke.c -Value 'int main(void){return 42;}'
          ./bin/${{ inputs.host }}-clang.exe smoke.c -o smoke.exe
          if (-not (Test-Path smoke.exe)) { throw "link failed" }
          ./smoke.exe
          if ($LASTEXITCODE -ne 42) { throw "smoke.exe returned $LASTEXITCODE" }

      - name: Native C++ (libc++/threads)
        shell: pwsh
        run: |
          Set-Content -Path smoke.cc -Value "#include <iostream>`n#include <thread>`nint main(){std::thread t([]{});t.join();std::cout<<`"ok`"<<std::endl;}"
          ./bin/${{ inputs.host }}-clang++.exe -pthread smoke.cc -o smokepp.exe
          ./smokepp.exe
          if ($LASTEXITCODE -ne 0) { throw "smokepp.exe returned $LASTEXITCODE" }

      - name: Cross out to linux-musl (canadian check)
        shell: pwsh
        run: |
          Set-Content -Path hello.c -Value 'int main(void){return 0;}'
          ./bin/x86_64-linux-musl-clang.exe hello.c -o hello-musl
          $fmt = ./clang/bin/llvm-readobj.exe --file-headers hello-musl | Select-String 'Format:'
          if (-not ($fmt -match 'elf64')) { throw "musl output is not ELF64: $fmt" }

      - name: clang-cl compile smoke
        shell: pwsh
        run: |
          ./clang/bin/clang-cl.exe /nologo /c /Fo:cl-smoke.obj -- smoke.c
          if (-not (Test-Path cl-smoke.obj)) { throw "clang-cl compile failed" }
