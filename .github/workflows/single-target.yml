name: Single Target Build

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Target to build"
        required: true
        type: string
      platform:
        description: "Platform"
        required: true
        type: choice
        options:
          - linux-x86_64
          - linux-aarch64
          - linux-armv7
          - linux-riscv64
          - linux-powerpc64le
          - linux-s390x
          - darwin-aarch64
          - darwin-x86_64
          - windows-x86_64
          - windows-arm64
      tag:
        description: "Release tag (optional, defaults to current ref)"
        required: false
        type: string
        default: ""
      extra-build-flags:
        description: "Extra flags for build.sh"
        required: false
        type: string
        default: ""
  workflow_call:
    inputs:
      target:
        description: "Single target to build"
        required: true
        type: string
      platform:
        description: "Platform identifier (e.g., linux-aarch64, darwin-x86_64)"
        required: true
        type: string
      extra-build-flags:
        description: "Extra flags for build.sh"
        required: false
        type: string
        default: ""
      sources-cache-key:
        description: "Pre-computed sources cache key (skip calculation if provided)"
        required: false
        type: string
        default: ""
      sources-artifact:
        description: "Artifact name to download sources from (if provided, skip cache and download from artifact)"
        required: false
        type: string
        default: ""

jobs:
  setup:
    name: Setup ${{ inputs.target }}
    runs-on: ubuntu-24.04
    outputs:
      runs-on: ${{ steps.config.outputs.runs-on }}
      docker-platform: ${{ steps.config.outputs.docker-platform }}
      docker-image: ${{ steps.config.outputs.docker-image }}
      use-qemu: ${{ steps.config.outputs.use-qemu }}
      clang-host: ${{ steps.config.outputs.clang-host }}
      test-runner: ${{ steps.config.outputs.test-runner }}
      sources-cache-key: ${{ inputs.sources-cache-key || steps.cache-key.outputs.key }}
    steps:
      - uses: actions/checkout@v4

      - name: Install yq
        if: inputs.sources-cache-key == ''
        run: |
          sudo wget -qO /usr/local/bin/yq "https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64"
          sudo chmod +x /usr/local/bin/yq

      - name: Generate sources cache key
        if: inputs.sources-cache-key == ''
        id: cache-key
        run: |
          if [ "${{ inputs.target }}" = "clang" ]; then
            KEY=$(./scripts/sources.sh cache-key -T clang)
          else
            KEY=$(./scripts/sources.sh cache-key)
          fi
          # Scope the cache to the target: downloads are target-filtered,
          # so a shared key would let one target restore another's partial set
          echo "key=sources-${KEY}-${{ inputs.target }}" >> $GITHUB_OUTPUT
          echo "Sources cache key: sources-${KEY}-${{ inputs.target }}"

      - name: Determine platform config
        id: config
        run: |
          case "${{ inputs.platform }}" in
            linux-x86_64)
              echo "runs-on=ubuntu-24.04" >> $GITHUB_OUTPUT
              echo "docker-platform=linux/amd64" >> $GITHUB_OUTPUT
              echo "docker-image=amd64/alpine:latest" >> $GITHUB_OUTPUT
              echo "use-qemu=false" >> $GITHUB_OUTPUT
              ;;
            linux-aarch64)
              echo "runs-on=ubuntu-24.04-arm" >> $GITHUB_OUTPUT
              echo "docker-platform=linux/arm64" >> $GITHUB_OUTPUT
              echo "docker-image=arm64v8/alpine:latest" >> $GITHUB_OUTPUT
              echo "use-qemu=false" >> $GITHUB_OUTPUT
              ;;
            linux-armv7)
              echo "runs-on=ubuntu-24.04-arm" >> $GITHUB_OUTPUT
              echo "docker-platform=linux/arm/v7" >> $GITHUB_OUTPUT
              echo "docker-image=arm32v7/alpine:latest" >> $GITHUB_OUTPUT
              echo "use-qemu=false" >> $GITHUB_OUTPUT
              ;;
            linux-riscv64)
              echo "runs-on=ubuntu-24.04" >> $GITHUB_OUTPUT
              echo "docker-platform=linux/riscv64" >> $GITHUB_OUTPUT
              echo "docker-image=riscv64/alpine:edge" >> $GITHUB_OUTPUT
              echo "use-qemu=true" >> $GITHUB_OUTPUT
              ;;
            linux-powerpc64le)
              echo "runs-on=ubuntu-24.04" >> $GITHUB_OUTPUT
              echo "docker-platform=linux/ppc64le" >> $GITHUB_OUTPUT
              echo "docker-image=ppc64le/alpine:latest" >> $GITHUB_OUTPUT
              echo "use-qemu=true" >> $GITHUB_OUTPUT
              ;;
            linux-s390x)
              echo "runs-on=ubuntu-24.04" >> $GITHUB_OUTPUT
              echo "docker-platform=linux/s390x" >> $GITHUB_OUTPUT
              echo "docker-image=s390x/alpine:latest" >> $GITHUB_OUTPUT
              echo "use-qemu=true" >> $GITHUB_OUTPUT
              ;;
            darwin-aarch64)
              echo "runs-on=macos-26" >> $GITHUB_OUTPUT
              ;;
            darwin-x86_64)
              echo "runs-on=macos-26-intel" >> $GITHUB_OUTPUT
              ;;
            # windows-hosted clang: cross-build on linux, test on windows
            windows-x86_64)
              echo "runs-on=ubuntu-24.04" >> $GITHUB_OUTPUT
              echo "docker-platform=linux/amd64" >> $GITHUB_OUTPUT
              echo "docker-image=amd64/alpine:latest" >> $GITHUB_OUTPUT
              echo "use-qemu=false" >> $GITHUB_OUTPUT
              echo "clang-host=x86_64-w64-mingw32" >> $GITHUB_OUTPUT
              echo "test-runner=windows-latest" >> $GITHUB_OUTPUT
              ;;
            windows-arm64)
              echo "runs-on=ubuntu-24.04" >> $GITHUB_OUTPUT
              echo "docker-platform=linux/amd64" >> $GITHUB_OUTPUT
              echo "docker-image=amd64/alpine:latest" >> $GITHUB_OUTPUT
              echo "use-qemu=false" >> $GITHUB_OUTPUT
              echo "clang-host=aarch64-w64-mingw32" >> $GITHUB_OUTPUT
              echo "test-runner=windows-11-arm" >> $GITHUB_OUTPUT
              ;;
          esac

  build:
    name: Build ${{ inputs.target }}
    needs: setup
    runs-on: ${{ needs.setup.outputs.runs-on }}
    steps:
      - uses: actions/checkout@v4

      # For macOS: Install dependencies via brew
      - name: Init Dependencies (macOS)
        if: startsWith(inputs.platform, 'darwin')
        run: |
          xcrun simctl delete all || true
          sudo rm -rf ~/Library/Developer/CoreSimulator/Caches/* || true
          sudo defaults -currentHost write /Library/Preferences/com.apple.powerlogd SMCMonitorCadence 0 || true
          sudo launchctl unload -w /System/Library/LaunchDaemons/com.apple.PerfPowerServices.plist || true
          sudo killall PerfPowerServices || true
          sudo launchctl bootout system/com.apple.PerfPowerServices 2>/dev/null || true
          sudo launchctl bootout system/com.apple.metadata.mds 2>/dev/null || true

          wget https://github.com/biscuitehh/yeetd/releases/download/1.0/yeetd-normal.pkg
          sudo installer -pkg yeetd-normal.pkg -target /
          defaults write dev.biscuit.yeetd killapsd true
          yeetd &

          BREW_EXTRA=""
          if [ "${{ inputs.target }}" = "clang" ]; then
            BREW_EXTRA="cmake ninja"
          fi

          brew install \
            bash \
            make \
            gnu-sed \
            gawk \
            gpatch \
            coreutils \
            findutils \
            gcc@14 \
            perl \
            libtool \
            bison \
            texinfo \
            yq \
            rsync \
            vmtouch \
            $BREW_EXTRA

          # Lock gcc/g++ in memory for faster access
          GCC_PREFIX=$(brew --prefix gcc@14)
          sudo vmtouch -l -h -f -d "$GCC_PREFIX"

      # Try cache first
      - name: Restore sources cache
        id: cache
        timeout-minutes: 10
        uses: actions/cache/restore@v5
        with:
          path: sources
          key: ${{ needs.setup.outputs.sources-cache-key }}

      # If cache miss, try artifact
      - name: Download sources from artifact
        if: steps.cache.outputs.cache-hit != 'true' && inputs.sources-artifact != ''
        timeout-minutes: 10
        uses: actions/download-artifact@v7
        with:
          name: ${{ inputs.sources-artifact }}
          path: sources

      # If cache miss and no artifact, download directly
      - name: Download sources (Linux)
        if: steps.cache.outputs.cache-hit != 'true' && inputs.sources-artifact == '' && (startsWith(inputs.platform, 'linux') || startsWith(inputs.platform, 'windows'))
        run: |
          case "${{ runner.os }}-${{ runner.arch }}" in
            Linux-X64) YQ=yq_linux_amd64;;
            Linux-ARM64) YQ=yq_linux_arm64;;
            macOS-ARM64) YQ=yq_darwin_arm64;;
            macOS-X64) YQ=yq_darwin_amd64;;
          esac
          sudo wget -qO /usr/local/bin/yq "https://github.com/mikefarah/yq/releases/latest/download/$YQ"
          sudo chmod +x /usr/local/bin/yq
          bash ./scripts/sources.sh download -S sources -T "${{ inputs.target }}"

      - name: Download sources (macOS)
        if: steps.cache.outputs.cache-hit != 'true' && inputs.sources-artifact == '' && startsWith(inputs.platform, 'darwin')
        run: |
          case "${{ runner.os }}-${{ runner.arch }}" in
            Linux-X64) YQ=yq_linux_amd64;;
            Linux-ARM64) YQ=yq_linux_arm64;;
            macOS-ARM64) YQ=yq_darwin_arm64;;
            macOS-X64) YQ=yq_darwin_amd64;;
          esac
          sudo wget -qO /usr/local/bin/yq "https://github.com/mikefarah/yq/releases/latest/download/$YQ"
          sudo chmod +x /usr/local/bin/yq
          bash ./scripts/sources.sh download -S sources -T "${{ inputs.target }}"

      # Save cache if we downloaded (not from artifact, to avoid redundant cache)
      - name: Save sources cache
        if: steps.cache.outputs.cache-hit != 'true'
        timeout-minutes: 10
        uses: actions/cache/save@v5
        with:
          path: sources
          key: ${{ needs.setup.outputs.sources-cache-key }}

      # For macOS: Create case-sensitive volumes for work and orig directories
      - name: Create Case-sensitive volumes (macOS)
        if: startsWith(inputs.platform, 'darwin')
        run: |
          diskutil list
          # Locate the APFS container backing the system volume; hard-coded
          # disk numbers rot as runner images change layout
          DISK=$(diskutil info / | awk '/Part of Whole/ {print $4}')
          echo "Using APFS container: $DISK"
          if [ "${{ inputs.target }}" = "clang" ]; then
            # LLVM build dirs exceed the RAM disk budget; use disk-backed
            # case-sensitive volumes for the clang toolchain build
            diskutil apfs addVolume $DISK "Case-sensitive APFS" cross
          elif [[ "${{ inputs.platform }}" == "darwin-x86_64" ]]; then
            # RAM disk for work directory (x86_64 only, aarch64 has enough disk space)
            diskutil erasevolume "Case-sensitive HFS+" cross $(hdiutil attach -nomount ram://12582912)
          else
            diskutil apfs addVolume $DISK "Case-sensitive APFS" cross
          fi
          # Physical disk for orig directory (case-sensitive for FreeBSD/NetBSD)
          diskutil apfs addVolume $DISK "Case-sensitive APFS" orig
          rsync -a --exclude=sources ./ /Volumes/cross/

      # For Linux with QEMU
      - name: Set up QEMU
        if: needs.setup.outputs.use-qemu == 'true'
        uses: docker/setup-qemu-action@v3

      # Build on Linux (Docker with tmpfs)
      - name: Build (Linux)
        if: startsWith(inputs.platform, 'linux') || startsWith(inputs.platform, 'windows')
        run: |
          WORK_OPTS="--tmpfs /work:exec,size=8G"
          APK_EXTRA=""
          EXTRA_FLAGS=""
          if [ "${{ inputs.target }}" = "clang" ]; then
            # LLVM build dirs exceed the tmpfs budget, and the clang build
            # needs cmake/ninja in the container
            WORK_OPTS="--volume ${PWD}/work:/work"
            APK_EXTRA="cmake ninja"
            if [ -n "${{ needs.setup.outputs.clang-host }}" ]; then
              EXTRA_FLAGS="-H ${{ needs.setup.outputs.clang-host }}"
            fi
          fi
          export APK_EXTRA EXTRA_FLAGS
          docker run --rm \
            --platform ${{ needs.setup.outputs.docker-platform }} \
            --cap-add=IPC_LOCK \
            $WORK_OPTS \
            --env APK_EXTRA \
            --env EXTRA_FLAGS \
            --volume "${PWD}:/src:ro" \
            --volume "${PWD}/sources:/sources" \
            --volume "${PWD}/dist:/dist" \
            --volume "${PWD}/orig:/orig" \
            ${{ needs.setup.outputs.docker-image }} \
            /bin/sh -c '
              apk add --no-cache \
                coreutils \
                curl \
                bzip2 \
                xz \
                make \
                bison \
                rsync \
                patch \
                perl \
                flex \
                g++ \
                texinfo \
                python3 \
                gawk \
                grep \
                bash \
                tar \
                file \
                zip \
                yq \
                findutils \
                $APK_EXTRA && \
              apk add --no-cache vmtouch --repository=https://dl-cdn.alpinelinux.org/alpine/edge/testing && \
              vmtouch -l -h -f -d /usr/bin/g++ /usr/libexec/gcc /usr/lib/gcc && \
              rsync -a --exclude=sources --exclude=work /src/ /work/ && \
              find /sources -type f -exec touch {} + && \
              cd /work && \
              bash scripts/build.sh \
                -LDPl \
                -a \
                -S /sources \
                -R /orig \
                -o /dist \
                ${{ inputs.extra-build-flags }} \
                ${EXTRA_FLAGS} \
                -T "${{ inputs.target }}"'

      - name: Build (macOS)
        if: startsWith(inputs.platform, 'darwin')
        working-directory: /Volumes/cross
        run: |
          find "${{ github.workspace }}/sources" -type f -exec touch {} +
          bash scripts/build.sh \
            -LDPl \
            -c "gcc-14" \
            -x "g++-14" \
            -a \
            -S "${{ github.workspace }}/sources" \
            -R /Volumes/orig \
            -o "${{ github.workspace }}/dist" \
            ${{ inputs.extra-build-flags }} \
            -T "${{ inputs.target }}"

      - name: Upload dist
        timeout-minutes: 10
        uses: actions/upload-artifact@v6
        with:
          name: ${{ inputs.target }}-${{ inputs.platform }}
          if-no-files-found: error
          path: ${{ startsWith(inputs.platform, 'windows') && 'dist/clang-win-*.tgz' || 'dist/*.*' }}

  # Windows-hosted clang: run the cross-compiled toolchain natively
  windows-test:
    name: Windows test (${{ needs.setup.outputs.test-runner }})
    needs: [setup, build]
    if: startsWith(inputs.platform, 'windows') && inputs.target == 'clang'
    runs-on: ${{ needs.setup.outputs.test-runner }}
    steps:
      - name: Download toolchain
        timeout-minutes: 10
        uses: actions/download-artifact@v7
        with:
          name: ${{ inputs.target }}-${{ inputs.platform }}

      - name: Extract
        shell: pwsh
        run: |
          $tgz = Get-ChildItem *.tgz | Select-Object -First 1
          tar -xzf $tgz.Name

      - name: clang --version
        shell: pwsh
        run: ./clang/bin/clang.exe --version

      - name: Native PE build and run (host triple)
        shell: pwsh
        run: |
          Set-Content -Path smoke.c -Value 'int main(void){return 42;}'
          ./bin/${{ needs.setup.outputs.clang-host }}-clang.exe smoke.c -o smoke.exe
          if (-not (Test-Path smoke.exe)) { throw "link failed" }
          ./smoke.exe
          if ($LASTEXITCODE -ne 42) { throw "smoke.exe returned $LASTEXITCODE" }

      - name: Native C++ (libc++/threads)
        shell: pwsh
        run: |
          Set-Content -Path smoke.cc -Value "#include <iostream>`n#include <thread>`nint main(){std::thread t([]{});t.join();std::cout<<`"ok`"<<std::endl;}"
          ./bin/${{ needs.setup.outputs.clang-host }}-clang++.exe -pthread smoke.cc -o smokepp.exe
          ./smokepp.exe
          if ($LASTEXITCODE -ne 0) { throw "smokepp.exe returned $LASTEXITCODE" }

      - name: Cross out to linux-musl (canadian check)
        shell: pwsh
        run: |
          Set-Content -Path hello.c -Value 'int main(void){return 0;}'
          ./bin/x86_64-linux-musl-clang.exe hello.c -o hello-musl
          $fmt = ./clang/bin/llvm-readobj.exe --file-headers hello-musl | Select-String 'Format:'
          if (-not ($fmt -match 'elf64')) { throw "musl output is not ELF64: $fmt" }

      - name: clang-cl compile smoke
        shell: pwsh
        run: |
          ./clang/bin/clang-cl.exe /nologo /c /Fo:cl-smoke.obj -- smoke.c
          if (-not (Test-Path cl-smoke.obj)) { throw "clang-cl compile failed" }

  # Release job uses reusable workflow
  release:
    name: Release ${{ inputs.target }}
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
    uses: ./.github/workflows/release.yml
    with:
      target: ${{ inputs.target }}
      platform: ${{ inputs.platform }}
      tag: ${{ inputs.tag != '' && inputs.tag || github.ref_name }}
    secrets: inherit
